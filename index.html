<html lang="vi">
  <head>

    <title>TP Petro — Giá Xăng Dầu Mới Nhất</title>
    <meta name="description" content="Thông báo điều chỉnh giá bán lẻ xăng dầu mới nhất từ TP Petro. Cập nhật giá Vùng 1 và Vùng 2 cho xăng, dầu diesel, dầu hỏa." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fuel.vn — Giá Xăng Dầu",
      "url": "https://fuel.vn",
      "description": "Cập nhật giá bán lẻ xăng dầu mới nhất từ Bộ Công Thương. Tra cứu giá xăng RON 95, E5 RON 92, dầu diesel, dầu hỏa cho Vùng 1 và Vùng 2.",
      "inLanguage": "vi-VN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://fuel.vn/gia-xang-dau/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fuel.vn",
      "url": "https://fuel.vn",
      "logo": "https://media.base44.com/images/public/6a396806623dcf432fdadf94/ce4838d6e_fuelvn-removebg-preview.png",
      "areaServed": "VN"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Giá xăng hôm nay bao nhiêu?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Giá xăng bán lẻ được điều chỉnh định kỳ theo quy định của Bộ Công Thương. Tra cứu giá mới nhất cho xăng RON 95, E5 RON 92, dầu diesel và dầu hỏa tại Fuel.vn."
          }
        },
        {
          "@type": "Question",
          "name": "Bao lâu thì điều chỉnh giá xăng dầu một lần?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Theo quy định, giá xăng dầu bán lẻ được điều chỉnh mỗi 10 ngày một lần, vào các ngày 1, 11 và 21 hàng tháng, hoặc khi biến động giá thế giới vượt quá ngưỡng quy định."
          }
        }
      ]
    }
    </script>
